<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Geolocation Finder</title>
    <!-- Lightweight Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; gap: 16px; }
        .card { background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #334155; }
        h2 { font-size: 1.2rem; margin-bottom: 12px; color: #38bdf8; }
        .input-group { display: flex; gap: 8px; margin-bottom: 16px; }
        input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; }
        button { padding: 10px 16px; border-radius: 8px; border: none; background: #0284c7; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #0369a1; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; font-size: 0.9rem; }
        .stat { background: #0f172a; padding: 10px; border-radius: 6px; }
        .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        .val { font-weight: 600; color: #f1f5f9; word-break: break-all; }
        #map { height: 300px; width: 100%; border-radius: 12px; border: 1px solid #334155; }
        .note { font-size: 0.8rem; color: #94a3b8; line-height: 1.4; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>IP Address Lookup</h2>
        <div class="input-group">
            <input type="text" id="ipInput" placeholder="Enter IP (e.g. 8.8.8.8)">
            <button onclick="lookupIP()">Search</button>
        </div>
        <div class="grid">
            <div class="stat"><div class="label">IP Address</div><div class="val" id="res-ip">-</div></div>
            <div class="stat"><div class="label">City</div><div class="val" id="res-city">-</div></div>
            <div class="stat"><div class="label">Region</div><div class="val" id="res-region">-</div></div>
            <div class="stat"><div class="label">Country</div><div class="val" id="res-country">-</div></div>
            <div class="stat"><div class="label">ISP</div><div class="val" id="res-isp">-</div></div>
            <div class="stat"><div class="label">Coordinates</div><div class="val" id="res-coords">-</div></div>
        </div>
        <p class="note">⚠️ <strong>Accuracy Note:</strong> IP geolocation targets network routing hubs/ISPs, not physical home street addresses.</p>
    </div>

    <div id="map"></div>

    <script>
        let map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker;

        async function lookupIP(ip = '') {
            try {
                const target = ip.trim();
                const url = target ? `https://ipapi.co/${target}/json/` : `https://ipapi.co/json/`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.error) throw new Error(data.reason || "Invalid IP");

                document.getElementById('res-ip').innerText = data.ip || '-';
                document.getElementById('res-city').innerText = data.city || '-';
                document.getElementById('res-region').innerText = data.region || '-';
                document.getElementById('res-country').innerText = data.country_name || '-';
                document.getElementById('res-isp').innerText = data.org || '-';
                document.getElementById('res-coords').innerText = `${data.latitude}, ${data.longitude}`;

                if (data.latitude && data.longitude) {
                    const lat = data.latitude;
                    const lon = data.longitude;
                    map.setView([lat, lon], 12);
                    if (marker) map.removeLayer(marker);
                    marker = L.marker([lat, lon]).addTo(map)
                        .bindPopup(`<b>${data.ip}</b><br>${data.city}, ${data.country_name}`)
                        .openPopup();
                }
            } catch (err) {
                alert("Error fetching IP data: " + err.message);
            }
        }

        // Auto detect current IP on load
        lookupIP('');
    </script>
</body>
</html>
