<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="logo">🎮 Arcade Hub</div>
        <button id="auth-btn" class="nav-btn">Sign In / Sign Up</button>
    </header>

    <!-- Main Arcade Grid Launcher -->
    <main class="dashboard">
        <div class="arcade-grid" id="arcade-grid">
            <!-- Dynamically populated game icons -->
        </div>
    </main>

    <!-- Authentication Modal (Hidden by default) -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>Create Account to Play</h2>
            <p>Sign up to save scores and unlock multiplayer.</p>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email address" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn">Continue</button>
            </form>
        </div>
    </div>

    <!-- Game Player Container Modal -->
    <div id="game-modal" class="modal hidden">
        <div class="game-modal-content">
            <div class="game-header">
                <h3 id="current-game-title">Game Title</h3>
                <span class="close-btn" id="close-game">&times;</span>
            </div>
            <div id="game-container">
                <!-- Active game canvas or iframe loads here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
