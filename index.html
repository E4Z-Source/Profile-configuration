<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Games Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Authentication Overlay -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <h2>Welcome to Arcade</h2>
            <p>Sign in to load your games.</p>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email address" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn">Play Now</button>
            </form>
        </div>
    </div>

    <!-- Arcade Launcher Grid Dashboard -->
    <div id="game-dashboard" class="dashboard hidden">
        <div class="arcade-grid" id="arcade-grid">
            <!-- Dynamically populated app style icons -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
